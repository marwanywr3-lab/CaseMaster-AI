<!doctype html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Meta Security & Identity -->
    <title>محرك التحقيق الجنائي المتقدم | Forensic Investigation Engine</title>
    <meta name="description" content="منصة تفاعلية احترافية لمحاكاة التحقيقات الجنائية والاستجوابات القانونية مدعومة بنماذج الذكاء الاصطناعي التوليدي من Google Gemini." />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph / Meta Protocol -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="محرك التحقيق الجنائي المتقدم" />
    <meta property="og:description" content="محاكاة مسارح الجرائم، استجواب الشهود، والتحليل الجنائي القانوني الفوري." />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'%3E%3C/circle%3E%3Cline x1='21' y1='21' x2='16.65' y2='16.65'%3E%3C/line%3E%3Cpath d='M11 8v6'%3E%3C/path%3E%3Cpath d='M8 11h6'%3E%3C/path%3E%3C/svg%3E" />

    <!-- Font Resource Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

    <!-- Inline Critical Style & Investigation CRT Texture -->
    <style>
      :root {
        --color-bg-base: #09090b;
        --color-accent: #f59e0b;
        --color-border: #27272a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-bg-base);
        color: #f4f4f5;
        font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      /* CRT Scanline & Grain Subtle Overlay */
      body::before {
        content: " ";
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
        z-index: 9999;
        background-size: 100% 4px, 6px 100%;
        pointer-events: none;
        opacity: 0.45;
      }

      /* Noise Overlay */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center, transparent 0%, rgba(9, 9, 11, 0.8) 100%);
        pointer-events: none;
        z-index: 9998;
      }

      /* Critical Fallback Loading Screen */
      #app-terminal-boot {
        position: fixed;
        inset: 0;
        background-color: #09090b;
        z-index: 9990;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        color: #d4d4d8;
        direction: ltr;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }

      .terminal-badge {
        padding: 4px 12px;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.3);
        color: #f59e0b;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
        border-radius: 4px;
      }

      .boot-loader {
        width: 280px;
        height: 2px;
        background: #27272a;
        position: relative;
        overflow: hidden;
        border-radius: 2px;
        margin-top: 1rem;
      }

      .boot-loader::after {
        content: '';
        position: absolute;
        left: -100%;
        top: 0;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, transparent, #f59e0b, transparent);
        animation: boot-pulse 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes boot-pulse {
        0% { left: -100%; }
        100% { left: 100%; }
      }

      /* Custom High-Precision Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <!-- Boot Telemetry Display (Removes automatically once React mounts) -->
    <div id="app-terminal-boot">
      <div class="terminal-badge">FORENSIC ENGINE OS // v2.5</div>
      <div style="font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; color: #fafafa;">
        INITIALIZING SECURE ENVIRONMENT
      </div>
      <div style="font-size: 0.8rem; color: #71717a; margin-top: 0.4rem;">
        Loading Cryptographic Core &amp; Gemini Flash Models...
      </div>
      <div class="boot-loader"></div>
    </div>

    <!-- Application Mounting Root -->
    <div id="root" class="relative z-10 min-h-screen flex flex-col"></div>

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
